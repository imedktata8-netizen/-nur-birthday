<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#6d2d5f55,transparent 35%),radial-gradient(circle at 90% 90%,#b05a7a44,transparent 40%);z-index:-1}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:min(560px,100%);text-align:center}

.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:25px}
.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;box-shadow:0 8px 24px #0008}
.gallery img:nth-child(2),.gallery img:nth-child(5){transform:rotate(1.2deg)}
.gallery img:nth-child(3),.gallery img:nth-child(6){transform:rotate(-1.2deg)}
.end{margin:28px 0 8px;color:#ddd;font-size:15px}
.heart{font-size:42px;animation:pulse 1.4s infinite}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
